<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace équipe — Camping de Ceyreste</title><link rel="stylesheet" href="admin.css?v=11"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js" onerror="window.CEYRESTE_SUPABASE={}"></script></head><body class="admin-body"><main class="admin-shell"><header><b>🏕️ Camping de Ceyreste</b><span>Espace équipe</span></header><section id="login"><div class="login"><div>🛠️</div><h1>Espace équipe</h1><p>Réception & Technique</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Mot de passe"><button id="loginBtn">SE CONNECTER</button><small id="loginMsg"></small><p class="demo">Sans Supabase configuré : mode démo local.</p></div></section><section id="dash" hidden><div class="top"><div><h1>🆘 Signalements</h1><p id="who"></p></div><button id="refresh">↻ Actualiser</button></div><div class="stats"><button data-filter="new">🔴 <b id="n">0</b> Nouveaux</button><button data-filter="in_progress">🟠 <b id="p">0</b> En cours</button><button data-filter="resolved">🟢 <b id="r">0</b> Résolus</button></div><div class="filters"><input id="q" placeholder="🔎 Numéro ou problème"><select id="f"><option value="">Tous les statuts</option><option value="new">Nouveaux</option><option value="in_progress">En cours</option><option value="resolved">Résolus</option></select></div><div id="list"></div></section></main><script src="admin.js?v=11"></script></body></html>
