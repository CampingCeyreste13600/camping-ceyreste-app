<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20b8c4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ceyreste">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Application officielle du Camping de Ceyreste">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=20260824-16">
  <title>Camping de Ceyreste</title>
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="hero-top">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <button class="icon-btn" id="installBtn" hidden aria-label="Installer">＋</button>
      <div id="languageSelector" class="language-selector" aria-label="Choisir la langue"></div>
    </div>
    <div class="brand">
      <img id="campingLogo" class="camping-logo hidden" alt="Logo Camping de Ceyreste">
      <div id="brandFallback">
        <div class="brand-mark">☀</div>
        <div class="brand-name">CAMPING DE<br><strong>Ceyreste</strong></div>
        <div class="stars">★ ★ ★</div>
      </div>
    </div>
    <div class="welcome" id="welcomeText"></div>
  </header>

  <main>
    <section class="welcome-card">
      <div class="mini-sun">☀️</div>
      <div>
        <div class="eyebrow dark">BIENVENUE</div>
        <h1 id="headline"></h1>
        <p id="subheadline"></p>
      </div>
    </section>

    <section class="tiles" id="tiles"></section>

    
    <section class="socials-card" id="socialsCard" aria-label="Réseaux sociaux"></section>

<section class="today-card">
      <div class="today-head">
        <div>
          <div class="eyebrow dark">AUJOURD'HUI AU CAMPING</div>
          <h2 id="todayTitle"></h2>
        </div>
        <span class="pill">☀️ À ne pas manquer</span>
      </div>
      <div class="today-items" id="todayItems"></div>
    </section>

    <section class="region-card">
      <div>
        <div class="eyebrow">À DÉCOUVRIR</div>
        <h2 id="regionTitle"></h2>
        <p id="regionText"></p>
        <button class="light-btn" data-open="region">Explorer →</button>
      </div>
    </section>

    <section class="gallery-card" id="galleryCard" hidden>
      <div class="eyebrow dark">PHOTOS DU CAMPING</div>
      <h2>Découvrez le camping</h2>
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>

    <section class="help-card">
      <h2>Besoin d'aide ?</h2>
      <p id="helpText"></p>
      <div class="actions">
        <a id="callLink" class="action" href="#">📞 Appeler</a>
        <a id="mailLink" class="action secondary" href="#">✉️ E-mail</a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button type="button" class="active" data-home aria-label="Accueil">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5v9a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"/><path d="M9 20.5v-6h6v6"/></svg></span>
      <span class="nav-label">Accueil</span>
    </button>
    <button type="button" data-open="planning" aria-label="Programme">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16M8 14h3M13 14h3M8 17.5h3"/></svg></span>
      <span class="nav-label">Programme</span>
    </button>
    <button type="button" data-open="notifications" aria-label="Infos">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v5M12 7.5h.01"/></svg></span>
      <span class="nav-label">Infos</span>
    </button>
    <button type="button" data-open="stay" aria-label="Mon séjour">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.6-3.2 3-5 6.5-5s5.9 1.8 6.5 5"/></svg></span>
      <span class="nav-label">Mon séjour</span>
    </button>
  </nav>
</div>

<div id="drawer" class="drawer hidden">
  <div class="drawer-panel">
    <button id="closeDrawer" class="close">×</button>
    <div class="drawer-brand">🏕️ <b>Camping de Ceyreste</b></div>
    <div id="drawerLinks"></div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-panel">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="config.js?v=20260824-16"></script>
<script src="app.js?v=20260824-16"></script>
</body>
</html>
